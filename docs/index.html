    emptyEl.style.display = filtered.length ? 'none' : 'block';
  }

  filterSource.addEventListener('change', render);
  filterCategory.addEventListener('change', render);
  filterSearch.addEventListener('input', render);
  render();
</script>
</body>
</html>
