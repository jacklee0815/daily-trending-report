name: Daily Trending Report

on:
  # 北京时间每天早上 6 点 (= UTC 22:00)
  schedule:
    - cron: "0 22 * * *"
  # 允许手动触发 (Actions 页面 -> Run workflow)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip email)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

# 防止多个任务并发跑 (例如手动触发 + 定时触发同时)
concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史才能提交回 history.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # openai 是可选, 仅当 LLM_API_KEY 设置时才装
          if [ -n "${{ secrets.LLM_API_KEY }}" ]; then
            pip install "openai>=1.30.0"
          fi

      - name: Run tests
        run: pytest tests/ -v

      - name: Run scraper
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # LLM (可选)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN - skipping email"
            python -m src.main 2>&1 | tee run.log || echo "main returned non-zero (acceptable in dry run)"
            exit 0
          else
            python -m src.main 2>&1 | tee run.log
          fi

      - name: Commit history snapshot and web UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/index.html run.log
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily trending snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy-pages:
    # 仅在 push 到 main 时部署 web UI
    needs: report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
